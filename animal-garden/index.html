<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Alana's Animal Garden</title>
<meta name="theme-color" content="#bfe8a0">
<meta name="description" content="Tap the animals in the garden and hear their real sounds — endless, chill, no rules.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Animal Garden">
<meta name="mobile-web-app-capable" content="yes">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bfe8a0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}
  body{touch-action:none}
  #game{position:fixed;inset:0;overflow:hidden;background:
    linear-gradient(#bfe6f5 0 42%,#dfe9b8 42% 60%,#94d16f 60% 100%)}
  .sun{position:absolute;top:6vh;right:8vw;width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle at 40% 38%, #fff7c2 0%, #ffe27a 55%, #ffd23f 100%);
    box-shadow:0 0 42px 10px #ffe27a66;pointer-events:none}
  .cloud{position:absolute;width:130px;height:35px;background:#fff;border-radius:30px;opacity:.9;pointer-events:none}
  .cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud:before{width:52px;height:52px;left:20px;bottom:5px}
  .cloud:after{width:65px;height:65px;right:18px;bottom:2px}
  .c1{left:6vw;top:7vh}.c2{left:55vw;top:11vh;transform:scale(.7)}
  #ground{position:absolute;left:0;right:0;bottom:0;height:26%;pointer-events:none;
    background:linear-gradient(#8ecf6a 0%,#5fb048 100%);border-radius:60% 60% 0 0/26px 26px 0 0}
  #hud{position:absolute;z-index:20;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 16px 0;
    display:flex;justify-content:center;align-items:center;gap:6px;pointer-events:none;font-size:22px;
    filter:drop-shadow(0 2px 4px #0002)}
  #hud span{transition:transform .3s;display:inline-block}
  #hud span.pop-in{animation:stickerPop .4s ease-out}
  @keyframes stickerPop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  #parentBtns{position:absolute;z-index:25;top:max(10px,env(safe-area-inset-top));right:14px;display:flex;gap:8px}
  #soundBtn,#fsBtn,#homeBtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);border:none;
    font-size:18px;box-shadow:0 4px 14px #0002;display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:.55;text-decoration:none;color:inherit}
  .sprite{position:absolute;z-index:10;cursor:pointer}
  .sprite.big{transform:scale(1.35)}
  .sprite .anim{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .sprite img.cutout{pointer-events:none;width:100%;height:auto;display:block;filter:drop-shadow(0 6px 5px #0002)}
  .sprite .badge{width:118px;height:118px;border-radius:50%;background:#fff;border:7px solid #fff;
    overflow:hidden;box-shadow:0 6px 14px #00000022}
  .sprite .badge img{width:100%;height:100%;object-fit:cover;pointer-events:none}
  .pop{position:absolute;z-index:30;font-weight:900;font-size:34px;color:#fff;text-shadow:0 3px 6px #0005;
    animation:pop .6s ease-out forwards;pointer-events:none;white-space:nowrap}
  @keyframes pop{0%{transform:scale(.4) translateY(0);opacity:0}25%{transform:scale(1.3) translateY(0);opacity:1}100%{transform:scale(1) translateY(-46px);opacity:0}}
  #hint{position:absolute;z-index:15;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:rgba(255,255,255,.9);padding:9px 16px;border-radius:999px;color:#3c6e2e;font-weight:700;
    font-size:15px;white-space:nowrap;box-shadow:0 3px 12px #0002;transition:opacity .5s}
  @keyframes drift{from{transform:translateX(-18vw) scale(var(--sc,1))}to{transform:translateX(118vw) scale(var(--sc,1))}}
  .cloud{animation:drift linear infinite}
  .c1{--sc:1;animation-duration:28s}.c2{--sc:.7;animation-duration:36s}
</style>
</head>
<body>
<div id="game">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div id="ground"></div>
  <div id="hud"></div>
  <div id="parentBtns">
    <a id="homeBtn" href="../" aria-label="Back to games">🏠</a>
    <button id="fsBtn" aria-label="Fullscreen">⛶</button>
    <button id="soundBtn" aria-label="Toggle sound">🔊</button>
  </div>
  <div id="hint">👆 Ketuk binatangnya!</div>
</div>
<script>
(() => {
  const game=document.getElementById('game'), hud=document.getElementById('hud'),
        soundBtn=document.getElementById('soundBtn'), fsBtn=document.getElementById('fsBtn'),
        hint=document.getElementById('hint');
  let lastSpawn=0, audioCtx=null, musicOn=true, musicStarted=false;
  let tapsSinceSticker=0, started=true;
  const stickers=['🐱','🐶','🐓','🐮','🦆','🐴','🐑','🦉','🐦'];
  const active=new Set();

  /* Real animal cutouts (transparent) vs real photos (round sticker badges). */
  const animals=[
    {key:'cat',    img:'assets/images/cat.png',    emoji:'🐱', cutout:true,  bw:104},
    {key:'dog',    img:'assets/images/dog.png',    emoji:'🐶', cutout:true,  bw:104},
    {key:'owl',    img:'assets/images/owl.png',    emoji:'🦉', cutout:true,  bw:168},
    {key:'rooster',img:'assets/images/rooster.jpg',emoji:'🐓', cutout:false, bw:118},
    {key:'cow',    img:'assets/images/cow.jpg',    emoji:'🐮', cutout:false, bw:118},
    {key:'duck',   img:'assets/images/duck.jpg',   emoji:'🦆', cutout:false, bw:118},
    {key:'sheep',  img:'assets/images/sheep.jpg',  emoji:'🐑', cutout:false, bw:118},
    {key:'horse',  img:'assets/images/horse.jpg',  emoji:'🐴', cutout:false, bw:118},
    {key:'bird',   img:'assets/images/bird.jpg',   emoji:'🐦', cutout:false, bw:118},
  ];

  function addSticker(emoji){
    const s=document.createElement('span'); s.textContent=emoji; s.className='pop-in';
    hud.appendChild(s);
    if(hud.children.length>10) hud.removeChild(hud.firstChild);
  }

  /* ---------- sound effects ---------- */
  function sound(freq,dur=.07,type='sine',vol=.045){
    if(!musicOn) return;
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=freq; o.type=type; g.gain.setValueAtTime(vol,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
      o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
  }
  function chime(){
    if(!musicOn) return;
    const notes=[440+Math.random()*80, 560+Math.random()*80, 700+Math.random()*80];
    notes.forEach((f,i)=>setTimeout(()=>sound(f,0.1,'sine',0.04), i*55));
  }

  /* ---------- real CC0 animal sounds (BigSoundBank) ---------- */
  /* Preloaded into Web Audio buffers for low-latency repeats. Each animal */
  /* falls back to a synthesized approximation if its file can't be loaded. */
  const buffers={};
  function preloadSounds(){
    if(Object.keys(buffers).length) return;
    animals.forEach(a=>{
      fetch('assets/'+a.key+'.mp3')
        .then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); })
        .then(buf=>audioCtx.decodeAudioData(buf)).then(b=>{buffers[a.key]=b;}).catch(()=>{});
    });
  }
  function playAnimal(key,isBig){
    if(!musicOn) return;
    const buf=buffers[key];
    const vol=isBig?0.5:0.38;
    try{
      if(buf){
        audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
        const src=audioCtx.createBufferSource(), g=audioCtx.createGain();
        src.buffer=buf; g.gain.value=vol;
        src.connect(g); g.connect(audioCtx.destination);
        src.start();
        return;
      }
    }catch(e){}
    synthAnimal(key,isBig);
  }
  /* Synthesized approximations — only used when the real file is missing. */
  function synthAnimal(key,isBig){
    const s=(f,d,t,v=0.05)=>sound(f,d,t,isBig?v*1.2:v);
    if(key==='cat'){ s(620,.12,'sine'); setTimeout(()=>s(430,.16,'sine'),90); }
    else if(key==='dog'){ s(340,.07,'square'); setTimeout(()=>s(280,.09,'square'),95); }
    else if(key==='rooster'){ s(500,.1,'square'); setTimeout(()=>s(640,.1,'square'),110); setTimeout(()=>s(760,.16,'square'),220); }
    else if(key==='cow'){ s(150,.5,'sawtooth'); setTimeout(()=>s(120,.5,'sawtooth'),80); }
    else if(key==='duck'){ s(520,.06,'square'); setTimeout(()=>s(360,.09,'square'),80); }
    else if(key==='horse'){
      if(!audioCtx) return;
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='triangle';
      o.frequency.setValueAtTime(820,audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(300,audioCtx.currentTime+0.55);
      g.gain.setValueAtTime(isBig?0.06:0.045,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+0.6);
      o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.65);
    }
    else if(key==='sheep'){ s(330,.09,'sine'); setTimeout(()=>s(270,.14,'sine'),90); }
    else if(key==='owl'){ s(300,.32,'sine',0.06); setTimeout(()=>s(250,.4,'sine',0.06),240); }
    else if(key==='bird'){ [900,1200,1500,1000].forEach((f,i)=>setTimeout(()=>s(f,.05,'sine',0.045),i*65)); }
  }

  /* ---------- generative, royalty-free background music ---------- */
  let musicGain=null, nextNoteTime=0, schedulerId=null;
  const scale=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
  let beat=0;
  function initMusic(){
    if(musicStarted) return;
    musicStarted=true;
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      preloadSounds();
      musicGain=audioCtx.createGain();
      musicGain.gain.value=musicOn?0.09:0;
      const filter=audioCtx.createBiquadFilter();
      filter.type='lowpass'; filter.frequency.value=2200;
      musicGain.connect(filter); filter.connect(audioCtx.destination);
      nextNoteTime=audioCtx.currentTime+0.1;
      scheduler();
    }catch(e){}
  }
  function playNote(freq,time,dur,type,vol){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,time);
    g.gain.linearRampToValueAtTime(vol,time+0.04);
    g.gain.exponentialRampToValueAtTime(0.0005,time+dur);
    o.connect(g); g.connect(musicGain);
    o.start(time); o.stop(time+dur+0.05);
  }
  function scheduleBeat(){
    const t=nextNoteTime;
    if(beat%4===0){
      const root=scale[0]/2;
      playNote(root,t,1.8,'triangle',0.5);
      playNote(root*1.5,t,1.8,'triangle',0.35);
    }
    if(Math.random()<0.8){
      const note=scale[Math.floor(Math.random()*scale.length)];
      playNote(note,t+(Math.random()<0.3?0.2:0),0.9,'sine',0.55);
    }
    beat++;
    nextNoteTime+=0.85;
  }
  function scheduler(){
    if(!audioCtx) return;
    while(nextNoteTime<audioCtx.currentTime+0.6){ scheduleBeat(); }
    schedulerId=setTimeout(scheduler,150);
  }
  function setMusicEnabled(on){
    musicOn=on;
    soundBtn.textContent=on?'🔊':'🔇';
    if(musicGain) musicGain.gain.setTargetAtTime(on?0.09:0, audioCtx.currentTime, 0.15);
  }
  soundBtn.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    initMusic();
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
    setMusicEnabled(!musicOn);
  });

  /* ---------- fullscreen / kiosk mode ---------- */
  function goFullscreen(){
    try{
      const el=document.documentElement;
      if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    }catch(e){}
  }
  function updateFsBtn(){ fsBtn.textContent = document.fullscreenElement ? '✕' : '⛶'; }
  fsBtn.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    if(document.fullscreenElement){ try{document.exitFullscreen();}catch(err){} }
    else goFullscreen();
  });
  document.getElementById('homeBtn').addEventListener('pointerdown',e=>e.stopPropagation());
  document.addEventListener('fullscreenchange',updateFsBtn);
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden && audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  });

  /* ---------- gameplay ---------- */
  function spawn(){
    const a=animals[Math.floor(Math.random()*animals.length)];
    const big=Math.random()<0.15;
    const el=document.createElement('div'); el.className='sprite'+(big?' big':'');
    el.innerHTML=a.cutout
      ? `<div class="anim"><img class="cutout" src="${a.img}" alt="" draggable="false"></div>`
      : `<div class="anim"><div class="badge"><img src="${a.img}" alt="" draggable="false"></div></div>`;
    el.dataset.a=a.key; el.dataset.big=big?'1':'0';
    game.appendChild(el);
    const bw=a.bw;
    el.style.width=bw+'px';
    const sw=Math.max(el.offsetWidth,40), sh=el.offsetHeight || Math.round(bw*0.85);
    const w=innerWidth,h=innerHeight;
    const x=4+Math.random()*(Math.max(w-sw,10));
    const y=Math.max(h*0.15,70)+Math.random()*Math.max(h*0.5-sh,10);
    el.style.left=x+'px'; el.style.top=y+'px';
    el.dataset.x=x; el.dataset.y=y; el.dataset.w=sw; el.dataset.h=sh;
    el.dataset.vx=(Math.random()-.5)*0.9; el.dataset.vy=(Math.random()-.5)*0.55;
    el.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      if(!started || !active.has(el)) return;
      initMusic();
      if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
      active.delete(el);
      const isBig=el.dataset.big==='1';
      playAnimal(el.dataset.a,isBig);
      chime();
      tapsSinceSticker++;
      if(tapsSinceSticker>=3){ addSticker(a.emoji); tapsSinceSticker=0; }
      pop(parseFloat(el.dataset.x)+sw/2, parseFloat(el.dataset.y)+sh/2, a.emoji);
      const anim=el.querySelector('.anim');
      if(anim) anim.style.transform='scale(1.35)';
      setTimeout(()=>el.remove(),140);
    },{passive:false});
    active.add(el);
    const img=el.querySelector('img');
    if(img) img.addEventListener('load',()=>{ el.dataset.h=el.offsetHeight||el.dataset.h; });
  }
  function pop(x,y,emoji){
    const p=document.createElement('div');p.className='pop';p.textContent=emoji;
    p.style.left=x+'px';p.style.top=y+'px';game.appendChild(p);
    setTimeout(()=>p.remove(),650);
  }
  function loop(t){
    if(t-lastSpawn>1050 && active.size<6){ spawn(); lastSpawn=t; }
    const w=innerWidth,h=innerHeight;
    active.forEach(el=>{
      let x=parseFloat(el.dataset.x)+parseFloat(el.dataset.vx);
      let y=parseFloat(el.dataset.y)+parseFloat(el.dataset.vy);
      const sw=parseFloat(el.dataset.w), sh=parseFloat(el.dataset.h);
      const maxX=Math.max(w-sw,10), maxY=h*0.72-sh, minY=Math.max(h*0.12,60);
      if(x<4||x>maxX) el.dataset.vx=(-parseFloat(el.dataset.vx));
      if(y<minY||y>maxY) el.dataset.vy=(-parseFloat(el.dataset.vy));
      x=Math.max(4,Math.min(maxX,x));
      y=Math.min(Math.max(y,minY),Math.max(maxY,minY));
      el.dataset.x=x;el.dataset.y=y;el.style.left=x+'px';el.style.top=y+'px';
    });
    requestAnimationFrame(loop);
  }
  game.addEventListener('pointerdown',()=>{
    if(!started)return;
    initMusic(); goFullscreen();
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  },{passive:true});
  requestAnimationFrame(loop);

  hint.style.opacity='1';
  setTimeout(()=>hint.style.opacity='0',3500);

  for(let i=0;i<3;i++) setTimeout(spawn,i*420);

  /* ---------- PWA service worker ---------- */
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
