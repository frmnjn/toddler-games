<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games — frmnjn.my.id</title>
<meta name="theme-color" content="#8ed6ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="rain-garden/icon-192.png">
<link rel="apple-touch-icon" href="rain-garden/icon-192.png">
<meta property="og:title" content="Games — frmnjn.my.id">
<meta property="og:description" content="Bermain game Alana: semut, bentuk, hujan, dan binatang.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://frmnjn.my.id/games/">
<meta property="og:image" content="https://frmnjn.my.id/games/rain-garden/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{margin:0;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#8ed6ff 0%,#b9e879 100%);
    font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:clamp(12px,3vh,24px) 16px;gap:clamp(6px,1.6vh,14px)}
  h1{text-align:center;color:#3a2b1a;font-size:clamp(22px,6vw,32px);margin:0}
  p.sub{text-align:center;color:#4a3a26;opacity:.75;margin:0;font-size:clamp(12px,3.4vw,14px)}
  #grid{width:100%;max-width:680px;flex:1;min-height:0;display:grid;gap:clamp(10px,2vw,18px);
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:stretch}
  @media (min-width:640px){#grid{grid-template-columns:repeat(4,1fr)}}
  a.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    text-decoration:none;background:rgba(255,255,255,.92);border-radius:18px;padding:clamp(8px,1.8vh,16px) 12px;
    box-shadow:0 6px 18px #0002;transition:transform .15s, box-shadow .15s}
  a.card:active{transform:scale(.96)}
  a.card img{width:clamp(52px,13vw,84px);height:auto;aspect-ratio:1;border-radius:16px;margin-bottom:8px;
    box-shadow:0 3px 8px #0002}
  a.card .title{font-weight:800;color:#3a2b1a;font-size:clamp(12px,3.4vw,15px);margin-bottom:3px}
  a.card .desc{font-size:clamp(10px,2.7vw,12px);color:#5a4a36;opacity:.8;line-height:1.25}
  #empty,#err{text-align:center;color:#4a3a26;opacity:.7}
</style>
</head>
<body>
  <h1>🎮 Games</h1>
  <p class="sub">Pilih game buat main</p>
  <div id="grid"></div>
  <div id="empty" style="display:none">Belum ada game.</div>
  <div id="err" style="display:none">Gagal memuat daftar game.</div>

<script>
fetch('games.json', {cache:'no-store'})
  .then(r => r.json())
  .then(data => {
    const grid = document.getElementById('grid');
    const list = data.games || [];
    if (!list.length) { document.getElementById('empty').style.display='block'; return; }
    list.forEach(g => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = g.url;
      a.innerHTML = `
        <img src="${g.icon}" alt="" onerror="this.style.display='none'">
        <div class="title">${g.title}</div>
        <div class="desc">${g.description || ''}</div>
      `;
      grid.appendChild(a);
    });
  })
  .catch(() => { document.getElementById('err').style.display='block'; });
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
